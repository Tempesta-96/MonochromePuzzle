services:
  monochrome-puzzle:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monochrome-puzzle
    working_dir: /app
    ports:
      - "8000:8000"
    environment:
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    volumes:
      - .:/app
    command: ["python", "xor_puzzle.py", "--web", "--host", "0.0.0.0", "--port", "8000"]

  monochrome-puzzle-cli:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monochrome-puzzle-cli
    working_dir: /app
    environment:
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    volumes:
      - .:/app
    command: ["python", "xor_puzzle.py", "--print-solution", "25"]
